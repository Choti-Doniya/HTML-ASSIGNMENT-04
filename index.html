<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Chess game</title>
</head>
<style>
     body {
          background-color: rgb(71, 71, 71);
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
          color: white;
          text-transform: uppercase;
     }

     .one {
          background-color: rgb(116, 194, 236);
     }

     .two {
          background-color: rgb(51, 103, 224);
     }

     table {
          border-radius: 30px;
          border-collapse: collapse;
     }
</style>

<body>
     <center>
          <h1>Chess game</h1>
          <table>
               <tr>
                    <td class="one"><img src="images/rook-b.svg" alt="goti"></td>
                    <td class="two"><img src="images/knight-b.svg" alt="goti"></td>
                    <td class="one"><img src="images/bishop-b.svg" alt="goti"></td>
                    <td class="two"><img src="images/queen-b.svg" alt="goti"></td>
                    <td class="one"><img src="images/king-b.svg" alt="goti"></td>
                    <td class="two"><img src="images/bishop-b.svg" alt="goti"></td>
                    <td class="one"><img src="images/knight-b.svg" alt="goti"></td>
                    <td class="two"><img src="images/rook-b.svg" alt="goti"></td>
               </tr>
               <tr>
                    <td class="two"><img src="images/pawn-b.svg" alt="goti"></td>
                    <td class="one"><img src="images/pawn-b.svg" alt="goti"></td>
                    <td class="two"><img src="images/pawn-b.svg" alt="goti"></td>
                    <td class="one"><img src="images/pawn-b.svg" alt="goti"></td>
                    <td class="two"><img src="images/pawn-b.svg" alt="goti"></td>
                    <td class="one"><img src="images/pawn-b.svg" alt="goti"></td>
                    <td class="two"><img src="images/pawn-b.svg" alt="goti"></td>
                    <td class="one"><img src="images/pawn-b.svg" alt="goti"></td>
               </tr>
               <tr>
                    <td class="one"><img src="images/empty-transparent.png" alt="empty" height="100" width="70"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"></td>
               </tr>
               <tr>
                    <td class="two"><img src="images/empty-transparent.png" alt="empty" height="100" width="70"></td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"> </td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
               </tr>
               <tr>
                    <td class="one"><img src="images/empty-transparent.png" alt="empty" height="100" width="70"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"></td>
               </tr>
               <tr>
                    <td class="two"><img src="images/empty-transparent.png" alt="empty" height="100" width="70"></td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
                    <td class="two"></td>
                    <td class="one"></td>
               </tr>
               <tr>
                    <td class="one"><img src="images/pawn-w.svg" alt="goti"></td>
                    <td class="two"><img src="images/pawn-w.svg" alt="goti"></td>
                    <td class="one"><img src="images/pawn-w.svg" alt="goti"></td>
                    <td class="two"><img src="images/pawn-w.svg" alt="goti"></td>
                    <td class="one"><img src="images/pawn-w.svg" alt="goti"></td>
                    <td class="two"><img src="images/pawn-w.svg" alt="goti"></td>
                    <td class="one"><img src="images/pawn-w.svg" alt="goti"></td>
                    <td class="two"><img src="images/pawn-w.svg" alt="goti"></td>
               </tr>
               <tr>
                    <td class="two"><img src="images/rook-w.svg" alt="goti"></td>
                    <td class="one"><img src="images/knight-w.svg" alt="goti"></td>
                    <td class="two"><img src="images/bishop-w.svg" alt="goti"></td>
                    <td class="one"><img src="images/queen-w.svg" alt="goti"></td>
                    <td class="two"><img src="images/king-w.svg" alt="goti"></td>
                    <td class="one"><img src="images/bishop-w.svg" alt="goti"></td>
                    <td class="two"><img src="images/knight-w.svg" alt="goti"></td>
                    <td class="one"><img src="images/rook-w.svg" alt="goti"></td>
               </tr>
          </table>
     </center>
</body>

</html>
